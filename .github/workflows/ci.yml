name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Valor ficticio: validate/generate no se conectan a la base de datos.
      DATABASE_URL: postgresql://user:password@localhost:5432/propinas?schema=public
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm sale del campo "packageManager" del package.json raíz.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint (incluye las reglas de pureza del motor)
        run: pnpm lint

      # El cliente de Prisma no se genera en la instalación: la app importa sus tipos, así que
      # tiene que existir antes del typecheck y de los tests.
      - name: Prisma validate
        run: pnpm prisma validate

      - name: Prisma generate
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests (motor de cálculo)
        run: pnpm test

      # Ejecuta el DDL de Prisma + 0001_constraints.sql sobre PGlite (PostgreSQL en WebAssembly).
      # No reemplaza probar contra un PostgreSQL real: ver DATABASE.md §10.
      - name: Tests de base de datos (PGlite)
        run: pnpm test:db

      # El motor de cálculo no puede tener dependencias de runtime.
      - name: tip-engine sin dependencias
        run: |
          node -e "const p=require('./packages/tip-engine/package.json'); for (const k of ['dependencies','peerDependencies','optionalDependencies']) { if (p[k] && Object.keys(p[k]).length) { console.error('tip-engine no puede declarar ' + k); process.exit(1); } }"

  # Migraciones y concurrencia contra un PostgreSQL real (misma versión mayor que Neon).
  # PGlite no puede probarlo: tiene una sola conexión. No toca Neon.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Servidor descartable: los tests crean y borran su propia base temporal.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Los tests del servicio importan el cliente de Prisma: generarlo antes (no se conecta
      # y no necesita DATABASE_URL).
      - name: Prisma generate
        run: pnpm prisma generate

      - name: Tests de migraciones y concurrencia (PostgreSQL 18)
        run: pnpm test:pg
